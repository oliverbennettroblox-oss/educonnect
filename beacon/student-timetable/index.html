<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Beacon | Student timetable</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f8fc;color:#17263c;font:15px/1.5 system-ui,sans-serif}main{max-width:1100px;margin:36px auto;padding:0 20px}h1{margin-bottom:4px}p{color:#617089}.panel{background:white;border:1px solid #dfe6ef;border-radius:14px;padding:22px;margin:18px 0}select{padding:11px;border:1px solid #cbd6e3;border-radius:9px;font:inherit}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{border:1px solid #e0e7ef;padding:12px;vertical-align:top;text-align:left}th{background:#edf3f9}td{min-width:125px}.lesson{background:#eaf3ff;padding:9px;border-radius:8px;margin:4px 0;font-size:13px}.divider{background:#f0f3f7;text-align:center;font-weight:800;letter-spacing:.15em;color:#506178}.muted{font-size:12px;color:#6b778a}</style></head><body><main><h1>Beacon · Student timetable</h1><p>Read-only school timetable. No sign-in required.</p><section class="panel"><h2 id="school">Loading timetable…</h2><label>Year group <select id="year"></select></label><p id="status"></p><div class="scroll" id="table"></div></section></main><script type="module">import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const client=createClient('https://mfsondwfqbtekwelnoki.supabase.co','sb_publishable_zghwKSWDJ-ykQNp-RS0NVA_TNi-b3kA');const token=new URLSearchParams(location.search).get('token'),school=document.getElementById('school'),year=document.getElementById('year'),table=document.getElementById('table'),status=document.getElementById('status');const days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];const time=v=>String(v||'').slice(0,5);const mins=v=>{const [h,m]=time(v).split(':').map(Number);return h*60+m};const clock=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');const cell=(tag,txt)=>{const e=document.createElement(tag);e.textContent=txt;return e};if(!token){school.textContent='Invalid student timetable link'}else{const {data,error}=await client.rpc('beacon_shared_student_timetable',{p_token:token});if(error||!data){school.textContent='This timetable link is unavailable';status.textContent=error?.message||'Ask your school for a new link.'}else{school.textContent=data.organisation;const cfg=data.settings,lessons=data.lessons||[];for(const group of cfg.year_groups||[])year.append(new Option(group,group));if(!year.options.length)year.append(new Option('All years',''));function draw(){table.replaceChildren();const t=document.createElement('table'),thead=document.createElement('thead'),tr=document.createElement('tr');tr.append(cell('th','Period'));for(const d of cfg.operating_days||[1,2,3,4,5])tr.append(cell('th',days[d]));thead.append(tr);t.append(thead);const body=document.createElement('tbody');let start=mins(cfg.day_start),duration=Number(cfg.period_minutes)||60;for(let n=1;n<=(Number(cfg.period_count)||6);n++){let from=start+(n-1)*duration+(n>cfg.break_after?Number(cfg.break_minutes)||0:0)+(n>cfg.lunch_after?Number(cfg.lunch_minutes)||0:0),to=from+duration;const row=document.createElement('tr');row.append(cell('th','Period '+n+' · '+clock(from)+'–'+clock(to)));for(const d of cfg.operating_days||[1,2,3,4,5]){const td=document.createElement('td');for(const item of lessons.filter(x=>x.weekday===d&&(!year.value||x.year_group===year.value)&&mins(x.start_time)<to&&mins(x.end_time)>from)){const block=cell('div',item.subject);block.className='lesson';block.append(cell('div',time(item.start_time)+'–'+time(item.end_time)));if(item.curriculum_module)block.append(cell('div',item.curriculum_module));td.append(block)}row.append(td)}body.append(row);for(const [name,after,length,offset] of [['BREAK',cfg.break_after,cfg.break_minutes,0],['LUNCH',cfg.lunch_after,cfg.lunch_minutes,cfg.break_after===n?Number(cfg.break_minutes)||0:0]])if(Number(after)===n&&Number(length)>0){const r=document.createElement('tr'),th=cell('th',name),td=cell('td',name+' · '+clock(to+offset)+'–'+clock(to+offset+Number(length)));td.colSpan=(cfg.operating_days||[1,2,3,4,5]).length;td.className='divider';r.append(th,td);body.append(r)}}t.append(body);table.append(t)}year.addEventListener('change',draw);draw();status.textContent='Select your year group to see your lessons.'}}</script></body></html>
