,{month:'short',year:'numeric'}):'';function tags(id,value){const el=document.getElementById(id);for(const v of (value||'').split(',').map(x=>x.trim()).filter(Boolean)){const tag=document.createElement('span');tag.className='tag';tag.textContent=v;el.append(tag)}document.getElementById(id+'Card').hidden=!el.childElementCount}function history(id,items){const el=document.getElementById(id);el.replaceChildren();if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='Nothing added yet.';el.append(p);return}

async function init(){if(!handle||!/^[a-z0-9_]{3,30}$/i.test(handle)){text('message','Profile not found.');return}let {data,error}=await db.rpc('beacon_public_profile',{handle});if((error||!data)&&new URLSearchParams(location.search).get('preview')==='1'){const {data:auth}=await db.auth.getUser();if(auth?.user){const {data:own}=await db.from('beacon_profiles').select('profile_name,first_name,middle_names,surname,about_me,skills,interests,photo_url,open_to_work,roblox_username,roblox_user_id').eq('user_id',auth.user.id).eq('profile_name',handle).maybeSingle();if(own){const [exp,quals]=await Promise.all([db.from('beacon_experience').select('*').eq('user_id',auth.user.id).order('start_date',{ascending:false}),db.from('beacon_qualifications').select('*').eq('user_id',auth.user.id).order('issued_on',{ascending:false})]);data={profile:own,experience:exp.data||[],qualifications:quals.data||[]}}}}if(!data){text('message','This profile is private or unavailable.');return}const p=data.profile;const name=[p.first_name,p.middle_names,p.surname].filter(Boolean).join(' ');text('name',name);if(p.roblox_username){const box=document.getElementById('robloxIdentity');box.hidden=false;const span=document.createElement('span');span.textContent='Roblox: @'+p.roblox_username+' ';box.append(span);if(p.roblox_user_id&&/^[0-9]{1,20}$/.test(p.roblox_user_id)){const a=document.createElement('a');a.href='https://www.roblox.com/users/'+p.roblox_user_id+'/profile';a.target='_blank';a.rel='noopener noreferrer';a.textContent='View Roblox account';box.append(a)}}text('opportunities',p.open_to_work?'Open to opportunities':'');text('about',p.about_me);document.getElementById('aboutCard').hidden=!p.about_me;tags('skills',p.skills);tags('interests',p.interests);const av=document.getElementById('avatar');if(p.photo_url){const img=document.createElement('img');img.src=p.photo_url;img.alt='Profile headshot';av.append(img)}else av.textContent=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();history('experience',data.experience||[]);history('qualifications',data.qualifications||[]);history('references',data.references||[]);document.title=name+' | Beacon';document.getElementById('message').hidden=true;document.getElementById('profile').hidden=false}document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==tab)}));init().catch(()=>text('message','Unable to load profile.'));</script></div><script>
