<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#092449"><title>Professional profile | Beacon</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>:root{--navy:#092449;--line:#e1e6ee;--muted:#6b778a}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;color:#17263c;font:14px/1.6 'DM Sans',Arial,sans-serif}.layout{max-width:850px;margin:0 auto;padding:28px 18px 70px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px}.logo{width:160px}.top a{color:var(--navy);font-weight:700;text-decoration:none}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:27px;margin-bottom:15px}.identity{display:flex;align-items:center;gap:22px}.avatar{width:96px;height:96px;border-radius:50%;background:#e7edf5;display:grid;place-items:center;font-weight:800;font-size:25px;color:var(--navy);overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.identity h1{font-size:26px;line-height:1.25;letter-spacing:-.7px;margin:0}.headline{font-size:14px;margin:7px 0;color:#344761}.muted{color:var(--muted)}.handle{font-size:12px;color:#7a8a9f}h2{font-size:17px;color:var(--navy);margin:0 0 15px}p{white-space:pre-wrap}section.item{padding:14px 0;border-bottom:1px solid var(--line)}section.item:last-child{border:0}section.item strong{font-size:15px;color:var(--navy)}section.item p{margin:4px 0}.tag{display:inline-block;border-radius:5px;background:#eaf0f8;color:var(--navy);padding:5px 9px;font-size:12px;margin:0 6px 6px 0}.badge{font-size:12px;color:var(--navy);font-weight:700}.empty{padding:45px 20px;text-align:center}.card[hidden]{display:none}@media(max-width:550px){.identity{align-items:flex-start;gap:14px}.avatar{width:70px;height:70px}.identity h1{font-size:21px}.card{padding:20px}} .profile-tabs{display:flex;gap:9px;border-bottom:1px solid #e1e6ee;margin:8px 0 20px;overflow-x:auto}.profile-tabs button{border:0;border-bottom:2px solid transparent;background:none;color:#6b778a;font:700 13px 'DM Sans',Arial,sans-serif;padding:13px 10px;cursor:pointer}.profile-tabs button.active{color:#092449;border-bottom-color:#092449}#opportunities:not(:empty){display:inline-flex;margin-top:8px;padding:5px 11px;border-radius:20px;background:#eaf0f8;color:#092449;border:1px solid #d6e1ef} </style></head><body><main class="layout"><header class="top"><a href="/beacon/dashboard/"><img class="logo" src="/beacon-logo-exact.svg" alt="Beacon"></a><a href="/beacon/dashboard/account/">My profile</a></header><div id="message" class="card empty" role="status">Loading profile…</div><div id="profile" hidden><div class="card identity"><div class="avatar" id="avatar"></div><div><h1 id="name"></h1><div class="muted" id="location"></div><div class="badge" id="opportunities"></div></div></div><nav class="profile-tabs" aria-label="Profile sections"><button class="active" data-tab="about">About</button><button data-tab="experience">Experience</button><button data-tab="qualifications">Qualifications</button><button data-tab="references">References</button></nav><div data-panel="about"><section class="card" id="aboutCard" hidden><h2>About</h2><p id="about"></p></section><section class="card" id="skillsCard" hidden><h2>Skills</h2><div id="skills"></div></section><section class="card" id="interestsCard" hidden><h2>Interests</h2><div id="interests"></div></section></div><div data-panel="experience" hidden><section class="card"><h2>Experience</h2><div id="experience"></div></section></div><div data-panel="qualifications" hidden><section class="card"><h2>Qualifications</h2><div id="qualifications"></div></section></div><div data-panel="references" hidden><section class="card"><h2>References</h2><div id="references"></div></section></div></div></main><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://mfsondwfqbtekwelnoki.supabase.co','sb_publishable_zghwKSWDJ-ykQNp-RS0NVA_TNi-b3kA');const handle=new URLSearchParams(location.search).get('u');const text=(id,v)=>document.getElementById(id).textContent=v||'';const date=v=>v?new Date(v+'T12:00:00').toLocaleDateString('en-GB',{month:'short',year:'numeric'}):'';function tags(id,value){const el=document.getElementById(id);for(const v of (value||'').split(',').map(x=>x.trim()).filter(Boolean)){const tag=document.createElement('span');tag.className='tag';tag.textContent=v;el.append(tag)}document.getElementById(id+'Card').hidden=!el.childElementCount}function history(id,items){const el=document.getElementById(id);if(!items.length){const p=document.createElement('p');p.className='muted';p.textContent='Nothing added yet.';el.append(p)}for(const item of items){const row=document.createElement('section');row.className='item';const strong=document.createElement('strong');strong.textContent=id==='experience'?item.job_title:id==='references'?item.author_name:item.title;const sub=document.createElement('p');sub.className='muted';sub.textContent=id==='experience'?[item.organisation,item.start_date&&date(item.start_date),item.is_current?'Present':item.end_date&&date(item.end_date)].filter(Boolean).join(' · '):id==='references'?[item.author_role,item.organisation,item.issued_on&&date(item.issued_on)].filter(Boolean).join(' · '):[item.institution,item.issued_on&&date(item.issued_on)].filter(Boolean).join(' · ');const desc=document.createElement('p');desc.textContent=item.description||item.reference_text||'';row.append(strong,sub,desc);if(item.credential_url&&id==='qualifications'){try{const url=new URL(item.credential_url);if(url.protocol==='https:'){const a=document.createElement('a');a.href=url.href;a.rel='noopener noreferrer';a.target='_blank';a.textContent='View credential';row.append(a)}}catch{}}el.append(row)}}async function init(){if(!handle||!/^[a-z0-9_]{3,30}$/i.test(handle)){text('message','Profile not found.');return}let {data,error}=await db.rpc('beacon_public_profile',{handle});if((error||!data)&&new URLSearchParams(location.search).get('preview')==='1'){const {data:auth}=await db.auth.getUser();if(auth?.user){const {data:own}=await db.from('beacon_profiles').select('profile_name,first_name,middle_names,surname,headline,about_me,skills,interests,location,photo_url,open_to_work').eq('user_id',auth.user.id).eq('profile_name',handle).maybeSingle();if(own){const [exp,quals]=await Promise.all([db.from('beacon_experience').select('*').eq('user_id',auth.user.id).order('start_date',{ascending:false}),db.from('beacon_qualifications').select('*').eq('user_id',auth.user.id).order('issued_on',{ascending:false})]);data={profile:own,experience:exp.data||[],qualifications:quals.data||[]}}}}if(!data){text('message','This profile is private or unavailable.');return}const p=data.profile;const name=[p.first_name,p.middle_names,p.surname].filter(Boolean).join(' ');text('name',name);text('location',p.location);text('opportunities',p.open_to_work?'Open to opportunities':'');text('about',p.about_me);document.getElementById('aboutCard').hidden=!p.about_me;tags('skills',p.skills);tags('interests',p.interests);const av=document.getElementById('avatar');if(p.photo_url){const img=document.createElement('img');img.src=p.photo_url;img.alt='Profile headshot';av.append(img)}else av.textContent=name.split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();history('experience',data.experience||[]);history('qualifications',data.qualifications||[]);history('references',data.references||[]);document.title=name+' | Beacon';document.getElementById('message').hidden=true;document.getElementById('profile').hidden=false}document.querySelectorAll('[data-tab]').forEach(button=>button.addEventListener('click',()=>{const tab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b===button));document.querySelectorAll('[data-panel]').forEach(p=>p.hidden=p.dataset.panel!==tab)}));init().catch(()=>text('message','Unable to load profile.'));</script></body></html>
